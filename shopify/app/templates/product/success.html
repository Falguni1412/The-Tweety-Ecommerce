{% extends 'base.html' %}
{% block title %}Order Confirmed - Shopify{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card text-center" style="max-width: 500px; margin: 0 auto;" data-aos="zoom-in">
        <div class="card-body p-5">
            <div style="font-size: 5rem; color: #10b981;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="mt-3 text-success">Order Confirmed!</h2>
            <p class="text-muted">Your order has been placed successfully.</p>
            <p class="text-muted">Your order will be delivered in 3-4 days!</p>
            <p class="fw-semibold text-primary">Thank you for shopping with us!</p>
            <div class="mt-4">
                <a href="{% url 'app:show_prod' %}" class="btn btn-primary">
                    <i class="fas fa-shopping-bag me-2"></i>Continue Shopping
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
