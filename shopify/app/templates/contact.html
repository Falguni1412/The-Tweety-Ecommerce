{% extends 'base.html' %}
{% block title %}Contact Us - Shopify{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="text-center mb-5" data-aos="fade-up">
            <h1 class="display-4 fw-bold">Get in Touch</h1>
            <p class="lead text-muted">We'd love to hear from you</p>
        </div>

        <div class="row g-4">
            <div class="col-md-4" data-aos="fade-up">
                <div class="card text-center h-100">
                    <div class="card-body p-4">
                        <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white;">
                            <i class="fas fa-envelope fa-2x"></i>
                        </div>
                        <h5>Email</h5>
                        <p class="text-muted mb-0">support@shopify.com</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                <div class="card text-center h-100">
                    <div class="card-body p-4">
                        <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white;">
                            <i class="fas fa-phone fa-2x"></i>
                        </div>
                        <h5>Phone</h5>
                        <p class="text-muted mb-0">+91 98765 43210</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4" data-aos="fade-up" data-aos-delay="200">
                <div class="card text-center h-100">
                    <div class="card-body p-4">
                        <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white;">
                            <i class="fas fa-map-marker-alt fa-2x"></i>
                        </div>
                        <h5>Address</h5>
                        <p class="text-muted mb-0">Mumbai, India</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
