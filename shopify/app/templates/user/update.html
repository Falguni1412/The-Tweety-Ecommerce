{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Edit Address - Shopify{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6" data-aos="fade-up">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: white; font-size: 1.75rem;">
                            <i class="fas fa-edit"></i>
                        </div>
                        <h3>Edit Address</h3>
                        <p class="text-muted">Update your delivery address details</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-success flex-grow-1 py-3">
                                <i class="fas fa-check me-2"></i>Update Address
                            </button>
                            <a href="{% url 'app:show_add' %}" class="btn btn-outline-secondary flex-grow-1 py-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
