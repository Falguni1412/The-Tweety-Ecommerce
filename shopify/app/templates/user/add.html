{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Add Address - Shopify{% endblock %}
{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'app:profile' %}" class="text-decoration-none">Profile</a></li>
            <li class="breadcrumb-item active">Add Address</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-6" data-aos="fade-up">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: white; font-size: 1.75rem;">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <h3>Add New Address</h3>
                        <p class="text-muted">Enter your delivery address details</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-success w-100 py-3 mt-3">
                            <i class="fas fa-check me-2"></i>Save Address
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'app:show_add' %}" class="text-muted text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Back to Addresses
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
