{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign In - Shopify{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-lg-5" data-aos="fade-up">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 2rem; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);">
                            <i class="fas fa-lock"></i>
                        </div>
                        <h2 class="mb-2">Welcome Back!</h2>
                        <p class="text-muted">Sign in to your account to continue</p>
                    </div>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-3 mt-3" style="font-size: 1rem;">
                            <i class="fas fa-sign-in-alt me-2"></i>Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">
                            Don't have an account?
                            <a href="{% url 'app:register' %}" class="text-primary text-decoration-none fw-semibold">Create Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
